<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">sujaldb: the LSM-tree write path</title>
  <desc id="desc">A write is appended to the write-ahead log first, then applied to the in-memory memtable. When the memtable fills, it is flushed as an immutable sorted string table. SSTables are merged through compaction. The WAL is implemented in version 1; the memtable and SSTable stages are planned.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#26313D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9299A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
      .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
      .ink{fill:#202936}.muted{fill:#626B77}.green{fill:#1F7A74}
      .planned{stroke:#9299A3;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#FBF7F0"/>
  <text x="60" y="78" class="sans ink" font-family="Georgia,serif" font-size="46" font-weight="700">sujaldb</text>
  <text x="60" y="111" class="mono muted" font-size="17">an LSM-tree storage engine in Rust, built one layer at a time</text>
  <text x="60" y="174" class="sans muted" font-size="14" letter-spacing="1.5">THE WRITE PATH</text>

  <!-- Incoming operation -->
  <rect x="60" y="270" width="170" height="66" rx="11" fill="#FFFFFF" stroke="#26313D" stroke-width="2"/>
  <text x="145" y="296" text-anchor="middle" class="sans muted" font-size="12">CLIENT WRITE</text>
  <text x="145" y="319" text-anchor="middle" class="mono ink" font-size="16">set(key, value)</text>
  <path d="M230 303 H276" fill="none" stroke="#26313D" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- WAL -->
  <rect x="286" y="220" width="240" height="166" rx="14" fill="#FFFFFF" stroke="#1F7A74" stroke-width="2.5"/>
  <circle cx="316" cy="250" r="12" fill="#202936"/>
  <text x="316" y="255" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="338" y="257" class="sans ink" font-size="20" font-weight="700">WAL</text>
  <rect x="420" y="237" width="88" height="25" rx="12" fill="#1F7A74"/>
  <text x="464" y="254" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">built · v1</text>
  <text x="310" y="291" class="sans muted" font-size="14">Append record to disk</text>
  <g class="mono" font-size="12" text-anchor="middle" fill="#202936">
    <rect x="310" y="309" width="55" height="40" rx="5" fill="#E3F1EF" stroke="#1F7A74"/>
    <text x="337" y="334">#1 set</text>
    <rect x="373" y="309" width="55" height="40" rx="5" fill="#E3F1EF" stroke="#1F7A74"/>
    <text x="400" y="334">#2 set</text>
    <rect x="436" y="309" width="66" height="40" rx="5" fill="#E3F1EF" stroke="#1F7A74"/>
    <text x="469" y="334">#3 del</text>
  </g>
  <text x="310" y="370" class="mono muted" font-size="11">sequential, append-only log</text>

  <!-- WAL to memtable -->
  <path d="M526 303 H575" fill="none" stroke="#26313D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="550" y="287" text-anchor="middle" class="mono muted" font-size="11">then</text>

  <!-- Memtable -->
  <rect x="585" y="220" width="240" height="166" rx="14" fill="#FFFFFF" class="planned" stroke-width="2.5"/>
  <circle cx="615" cy="250" r="12" fill="#202936"/>
  <text x="615" y="255" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="637" y="257" class="sans ink" font-size="20" font-weight="700">Memtable</text>
  <rect x="747" y="237" width="64" height="25" rx="12" fill="none" stroke="#9299A3" stroke-dasharray="4 3"/>
  <text x="779" y="254" text-anchor="middle" class="mono muted" font-size="11">next</text>
  <text x="609" y="291" class="sans muted" font-size="14">Update in-memory structure</text>
  <rect x="609" y="307" width="190" height="58" rx="6" fill="#FFFFFF" stroke="#9299A3"/>
  <g class="mono ink" font-size="13">
    <text x="625" y="326">a  →  1</text>
    <text x="625" y="344">m  →  7</text>
    <text x="625" y="362">z  →  3</text>
  </g>
  <text x="609" y="379" class="mono muted" font-size="10">sorted in-memory data</text>

  <!-- Memtable to SSTable -->
  <path d="M825 303 H874" fill="none" stroke="#9299A3" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-muted)"/>
  <text x="850" y="287" text-anchor="middle" class="mono muted" font-size="11">flush</text>

  <!-- SSTable -->
  <rect x="884" y="220" width="256" height="166" rx="14" fill="none" class="planned" stroke-width="2.5"/>
  <circle cx="914" cy="250" r="12" fill="#202936"/>
  <text x="914" y="255" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="936" y="257" class="sans ink" font-size="20" font-weight="700">SSTable</text>
  <rect x="1062" y="237" width="64" height="25" rx="12" fill="none" stroke="#9299A3" stroke-dasharray="4 3"/>
  <text x="1094" y="254" text-anchor="middle" class="mono muted" font-size="11">later</text>
  <text x="908" y="291" class="sans muted" font-size="14">Immutable sorted file on disk</text>
  <g class="mono ink" font-size="12" text-anchor="middle">
    <rect x="908" y="309" width="62" height="40" rx="5" fill="#FFFFFF" stroke="#9299A3"/>
    <text x="939" y="334">a d f</text>
    <rect x="980" y="309" width="62" height="40" rx="5" fill="#FFFFFF" stroke="#9299A3"/>
    <text x="1011" y="334">b d k</text>
    <rect x="1052" y="309" width="64" height="40" rx="5" fill="#FFFFFF" stroke="#9299A3"/>
    <text x="1084" y="334">...</text>
  </g>
  <text x="908" y="370" class="mono muted" font-size="11">created by memtable flush</text>

  <!-- Explanatory notes -->
  <path d="M406 386 V424" stroke="#1F7A74" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <rect x="60" y="438" width="500" height="126" rx="12" fill="#E3F1EF"/>
  <text x="84" y="470" class="sans ink" font-size="18" font-weight="700">Why does the WAL come first?</text>
  <text x="84" y="498" class="sans" font-size="14" fill="#3D4854">The memtable lives in memory and can disappear on a crash.</text>
  <text x="84" y="521" class="sans" font-size="14" fill="#3D4854">The WAL is durable: replay it to rebuild the memtable.</text>
  <text x="84" y="545" class="mono muted" font-size="11">WAL first for recovery; memtable serves reads and writes.</text>

  <rect x="584" y="438" width="556" height="126" rx="12" fill="#FFFFFF" stroke="#D4D0C8" stroke-width="1.5"/>
  <text x="608" y="470" class="sans ink" font-size="18" font-weight="700">What happens after the flush?</text>
  <text x="608" y="498" class="sans" font-size="14" fill="#3D4854">New writes go into a fresh memtable while the old one</text>
  <text x="608" y="520" class="sans" font-size="14" fill="#3D4854">is flushed. Compaction later merges SSTables and removes</text>
  <text x="608" y="542" class="sans" font-size="14" fill="#3D4854">obsolete versions and tombstones when safe.</text>

  <text x="60" y="600" class="mono muted" font-size="12">sujaldb  /  architecture overview  /  WAL v1 implemented · memtable and SSTable ahead</text>
</svg>