<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">A traveller at a fork in the path at sunrise</title>
  <desc id="d">A small figure with a backpack stands where a path splits in two, looking toward a rising sun over warm hills.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1DC"/>
      <stop offset="0.55" stop-color="#FFD3A8"/>
      <stop offset="1" stop-color="#FFAE87"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFE0A3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFE0A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" gradientUnits="userSpaceOnUse" x1="0" y1="370" x2="0" y2="630">
      <stop offset="0" stop-color="#FFEFD0"/>
      <stop offset="1" stop-color="#FFD9A3"/>
    </linearGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#5B2E3F" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B2E3F" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

